; Wi-Fi Pager — V1 firmware
; Seeed Studio XIAO ESP32-C3, Arduino framework.
; Build/upload:  pio run -t upload   |   Serial monitor: pio device monitor

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0
